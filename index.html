<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一中男排 2027 练球时间表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#f1f4f9;--card:#fff;--fg:#12203a;--muted:#617089;--line:#dbe2ec;--navy:#0f2a5c;--blue:#1c5bb8;--blue-soft:#e6effc;--gold:#ffc933;--gold-soft:#fff1c9;--gold-ink:#7a4b00;--red:#b3264a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#151f33;--fg:#e8eef8;--muted:#98a8c2;--line:#27354f;--navy:#13306a;--blue:#8dbcff;--blue-soft:#1b3157;--gold:#ffc933;--gold-soft:#443512;--gold-ink:#ffd976;--red:#ff91aa;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Noto Sans SC",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header{background:var(--navy);color:#fff;border-bottom:5px solid var(--gold);padding-block:24px}
header h1{margin:0;font-size:clamp(23px,5vw,36px);font-weight:900;line-height:1.25;text-wrap:balance}
header p{margin:4px 0 0;color:#c5d4f2;font-size:13px;letter-spacing:.2em}
main{display:flex;flex-direction:column;gap:14px;padding-block:16px 40px}
h2{margin:0;font-size:17px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--blue);border-color:var(--blue);color:var(--card);font-weight:700}
.status{margin:0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.comp{display:flex;gap:14px;align-items:center}
.count{flex:none;min-width:88px;text-align:center;background:var(--gold);color:#2b1b00;border-radius:10px;padding:8px 10px;font:700 42px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.count small{display:block;font:700 12px "Noto Sans SC",sans-serif;margin-top:2px}
.comp>div{min-width:0;flex:1;overflow-wrap:anywhere}
.comp b{display:block;font-size:17px}
.comp>div>span{color:var(--muted);font-size:13px}
.comp.later .count{background:var(--gold-soft);color:var(--gold-ink);font-size:26px}
.month{display:flex;align-items:center;justify-content:space-between;gap:10px}
.month h2{font-size:20px}
#view{display:flex;flex-direction:column;gap:12px}
.date{font:700 22px/1.1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.date small{display:block;font:500 12px "Noto Sans SC",sans-serif;color:var(--muted)}
button.slot{display:block;width:100%;text-align:left;border:0;background:var(--blue-soft);color:var(--blue);font-size:12px;line-height:1.4;padding:6px 8px}
button.slot.m{background:var(--gold-soft);color:var(--gold-ink)}
button.slot:hover{outline:2px solid currentColor}
.slot b{display:block;font:700 18px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.slot span{display:block}
.slot .num{float:right;background:var(--card);border-radius:20px;padding:1px 8px;margin-left:4px;font:700 14px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.row-day .slot .num{font-size:19px;padding:2px 12px}
@media (min-width:761px){.day .slot .num{float:none;display:table;margin:0 0 3px}}
.tag{font-size:12px;border-radius:6px;padding:3px 8px;background:var(--bg);color:var(--muted);overflow-wrap:anywhere}
.tag.c{background:var(--gold);color:#2b1b00;font-weight:700}
.tag.h{color:var(--red)}
/* 球员版：一天一行 */
.row-day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px}
.row-day.today{border:2px solid var(--blue)}
.slots{display:flex;flex-direction:column;gap:8px;min-width:0}
.row-day .slot{font-size:14px;padding:10px 12px}
.row-day .slot b{font-size:23px}
/* 教练版：一周一张卡 */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:8px;padding:7px;min-width:0}
.day.past{background:var(--bg)}
.day.today{border:2px solid var(--blue)}
.edit{margin-top:auto;font-size:12px;padding:3px}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px}
label.chk,#alist label{flex-direction:row;align-items:center;gap:8px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;flex:none}
textarea{min-height:72px;resize:vertical}
.times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(440px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;padding:16px}
dialog::backdrop{background:#0009}
dialog form{display:flex;flex-direction:column;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#amsg{position:sticky;bottom:-16px;background:var(--card);padding-block:8px}
#alist{display:flex;flex-direction:column;gap:8px}
.player{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
.player button{padding:6px 12px;font-size:13px}
.player button.on-p{background:var(--blue);border-color:var(--blue);color:var(--card);font-weight:700}
.player button.on-l{background:var(--gold);border-color:var(--gold);color:#2b1b00;font-weight:700}
.reason{grid-column:1/-1;display:flex;gap:6px}
.reason input{flex:1}
.reason.shown{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.notice{border-left:0;background:var(--gold-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.notice small{color:var(--muted)}
.notice button{align-self:flex-end;font-size:12px;padding:3px 10px}
.slot .off{display:inline-block;font-size:12px;font-weight:700}
footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:12px}
footer button{font-size:12px;color:var(--muted);background:none}
@media (max-width:760px){.days{grid-template-columns:minmax(0,1fr)}.edit{margin:0}}
</style>
</head>
<body>
<header><div class="wrap"><h1>一中男排 2027 练球时间表</h1><p>一起练 · 一起拼</p></div></header>
<main class="wrap">
  <p class="status" id="status" role="status">读取中…</p>
  <section class="card" id="newsbox" hidden>
    <div class="bar"><h2>公告栏</h2><button type="button" id="addnews" hidden>＋ 发公告</button></div>
    <div id="news" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  <section class="card" id="focusbox" hidden><h2>本周训练重点</h2><p class="text" id="focus"></p></section>
  <section class="card" id="compbox" hidden>
    <div class="bar"><h2>接下来的比赛</h2><button type="button" id="addcomp" hidden>＋ 添加比赛</button></div>
    <div id="comps" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
  <nav class="month" aria-label="切换月份"><button type="button" id="prev" aria-label="上个月">◀</button><h2 id="mname"></h2><button type="button" id="next" aria-label="下个月">▶</button></nav>
  <div id="view"></div>
  <footer>
    <button type="button" id="loginbtn">教练登入</button>
    <button type="button" id="logoutbtn" hidden>登出</button>
    <button type="button" id="upload" hidden>把这台设备的旧备注上传</button>
  </footer>
</main>

<dialog id="att" aria-labelledby="atitle"><form id="aform">
  <h2 id="atitle"></h2><p class="status" id="ainfo"></p>
  <div id="alist"></div><p class="status" id="amsg" role="status"></p>
  <div class="actions"><button type="button" data-close>关闭</button></div>
</form></dialog>

<dialog id="login" aria-labelledby="ltitle"><form id="lform">
  <h2 id="ltitle">教练登入</h2>
  <label>Email<input type="email" id="l-email" autocomplete="username" required></label>
  <label>密码<input type="password" id="l-pass" autocomplete="current-password" required></label>
  <p class="status" id="lerr" role="alert"></p>
  <div class="actions"><button type="button" data-close>取消</button><button type="submit" class="primary">登入</button></div>
</form></dialog>

<dialog id="dlg" aria-labelledby="dtitle"><form id="dform">
  <h2 id="dtitle"></h2>
  <label class="chk"><input type="checkbox" id="f-rest">当天休息</label>
  <fieldset><label class="chk"><input type="checkbox" id="f-on">练球</label><div class="times" id="f-t"></div><label>地点<input id="f-loc" maxlength="60"></label></fieldset>
  <fieldset><label class="chk"><input type="checkbox" id="f-match">友谊赛</label><div class="times" id="f-mt"></div><label>对手（可留空）<input id="f-opp" maxlength="60"></label><label>地点<input id="f-mloc" maxlength="60"></label></fieldset>
  <div id="extras" style="display:flex;flex-direction:column;gap:8px"></div>
  <button type="button" id="addslot">＋ 加时间段</button>
  <label>当天备注（只在教练版显示）<textarea id="f-note" maxlength="500"></textarea></label>
  <p class="status" id="derr" role="alert"></p>
  <div class="actions"><button type="button" id="reset">恢复默认</button><button type="button" data-close>取消</button><button type="submit" class="primary">保存</button></div>
</form></dialog>

<dialog id="ndlg" aria-labelledby="ntitle"><form id="nform">
  <h2 id="ntitle">公告</h2>
  <label>内容（所有人看得到）<textarea id="n-text" maxlength="500" required></textarea></label>
  <p class="status" id="nerr" role="alert"></p>
  <div class="actions"><button type="button" id="n-del">删除公告</button><button type="button" data-close>取消</button><button type="submit" class="primary">发布</button></div>
</form></dialog>

<dialog id="cdlg" aria-labelledby="ctitle"><form id="cform">
  <h2 id="ctitle">比赛</h2>
  <label>日期<input type="date" id="c-date" min="2026-11-26" max="2027-12-31" required></label>
  <label>比赛名称<input id="c-name" maxlength="60" required></label>
  <label>地点（可留空）<input id="c-place" maxlength="60"></label>
  <p class="status" id="cerr" role="alert"></p>
  <div class="actions"><button type="button" id="c-del">删除比赛</button><button type="button" data-close>取消</button><button type="submit" class="primary">保存</button></div>
</form></dialog>

<script>
/* ===== Supabase 设定 ===== */
const SB_URL = 'https://ihfgmukwbjnbutqeuiuj.supabase.co';   // 例如 https://abcdxyz.supabase.co
const SB_KEY = 'sb_publishable_cYoSqgMQJSwYgUC-Tsvwng_fkTkFck4';   // Publishable key (sb_publishable_...)。绝对不要放 secret key
/* ========================= */
(()=>{
const $=id=>document.getElementById(id);
const DAY=864e5, parse=s=>Date.parse(s+'T00:00:00Z'), iso=t=>new Date(t).toISOString().slice(0,10);
const todayMY=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuching'}).format(new Date());
const FROM='2026-11-26', END='2027-12-31', FIRST='2026-11', LAST='2027-12', PLACE='一中排球场';
const short=d=>+d.slice(8)+'/'+ +d.slice(5,7);
const wk=d=>'周'+'日一二三四五六'[new Date(parse(d)).getUTCDay()];
const monday=d=>iso(parse(d)-((new Date(parse(d)).getUTCDay()+6)%7)*DAY);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const btn=(cls,text,fn)=>{const b=el('button',cls,text);b.type='button';b.onclick=fn;return b};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* 学校假期与公共假期（教练版显示） */
const HOL={};
const span=(a,b,n)=>{for(let t=parse(a);t<=parse(b);t+=DAY){const k=iso(t);HOL[k]=HOL[k]?HOL[k]+'、'+n:n}};
[['2026-12-05','2027-01-03','学校假期'],['2026-12-25','2026-12-25','圣诞节'],['2027-01-01','2027-01-01','元旦'],['2027-02-05','2027-02-05','学校假期'],['2027-02-06','2027-02-07','农历新年'],['2027-02-09','2027-02-12','学校假期'],['2027-03-06','2027-03-14','学校假期'],['2027-03-10','2027-03-11','开斋节(暂定)'],['2027-03-26','2027-03-26','Good Friday'],['2027-05-01','2027-05-01','劳动节'],['2027-05-17','2027-05-17','哈芝节(暂定)'],['2027-05-18','2027-05-19','学校假期'],['2027-05-20','2027-05-20','卫塞节'],['2027-05-21','2027-06-06','学校假期'],['2027-06-01','2027-06-02','达雅节'],['2027-06-07','2027-06-07','元首诞辰'],['2027-07-22','2027-07-22','砂拉越日'],['2027-08-28','2027-09-05','学校假期'],['2027-08-31','2027-08-31','国庆日'],['2027-09-16','2027-09-16','马来西亚日'],['2027-10-09','2027-10-09','州元首诞辰'],['2027-10-28','2027-10-28','学校假期'],['2027-12-04','2027-12-31','学校假期'],['2027-12-25','2027-12-25','圣诞节']].forEach(x=>span(...x));

/* 默认时间表 */
function defaults(d){
  const w=new Date(parse(d)).getUTCDay(), on=d>=FROM&&d<=END, end=w===0||w===6;
  return {rest:false,time:on&&w!==0?(end?'19:00–22:00':'17:00–19:30'):'',loc:PLACE,match:on&&(w===0||w===5),mtime:'19:00–22:00',opp:'',mloc:PLACE,extra:[],note:''};
}
const times=s=>(String(s||'').match(/\d{1,2}:\d{2}/g)||[]).map(t=>t.padStart(5,'0'));
function info(d){
  const x={...defaults(d),...(days[d]||{})};
  if(x.opp===''&&days[d]&&days[d].opp===undefined)x.opp=String(days[d].mtime||'').replace(/\d{1,2}:\d{2}|[–—~-]|晚上/g,'').trim();
  return x;
}
/* 当天所有时间段，按开始时间排序 */
function slotsOf(d){
  const x=info(d), out=[];
  if(x.rest)return out;
  if(x.time)out.push({key:'practice',label:'练球',time:x.time,place:x.loc});
  if(x.match)out.push({key:'match',label:x.opp?'友谊赛 · '+x.opp:'友谊赛',time:times(x.mtime).join('–'),place:x.mloc,m:true});
  (x.extra||[]).forEach(e=>out.push({key:e.id,label:e.label||'练球',time:e.time,place:e.loc}));
  const start=s=>times(s.time)[0]||'99';
  return out.sort((a,b)=>start(a).localeCompare(start(b)));
}

/* Supabase */
const cloud=!!(SB_URL&&SB_KEY)&&!SB_KEY.startsWith('sb_secret_');
const base=SB_URL.trim().replace(/\/(rest\/v1)?\/?$/,'');
const notes={}, days={};
let tally=null, tallyRun=0;
/* 每个时间段的出席人数（只有数字，不含名字） */
async function loadTally(){
  const run=++tallyRun;
  try{const r=await api('/rest/v1/rpc/attendance_counts',{method:'POST',body:JSON.stringify({p_from:FROM,p_to:END})});if(run===tallyRun)tally=r}catch{}
}
let session=store.get('vb-session'), writes=0, loaded=false, refreshing=null, last='';
let today=todayMY(), month=today.slice(0,7);
if(month<FIRST)month=FIRST;if(month>LAST)month=LAST;
const fail=(code,extra)=>Object.assign(new Error(code),{code},extra);
async function api(path,opt={},tok){
  const headers={apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})};
  if(tok)headers.Authorization='Bearer '+tok;
  const r=await fetch(base+path,{...opt,headers});
  if(!r.ok){const b=await r.json().catch(()=>({}));throw fail('http',{status:r.status,detail:b.message||''})}
  const t=await r.text();return t?JSON.parse(t):null;
}
function setSession(a){
  session=a?{access:a.access_token,refresh:a.refresh_token,exp:Date.now()+a.expires_in*1000}:null;
  store.set('vb-session',session);render();
}
async function token(){
  if(!session)throw fail('login');
  if(Date.now()>session.exp-60000){
    refreshing=refreshing||api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh})})
      .then(setSession,e=>{if(e.status>=400&&e.status<500){setSession(null);throw fail('login')}throw e}).finally(()=>refreshing=null);
    await refreshing;
  }
  return session.access;
}
async function save(rows){
  const t=await token();
  await api('/rest/v1/calendar_entries?on_conflict=kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.map(r=>({...r,updated_at:new Date().toISOString()})))},t);
  writes++;
  rows.forEach(r=>{if(r.kind==='weeks')notes[r.id]=r.data.note;else days[r.id]=r.data});
}
const why=e=>e.code==='login'?'请先登入':e.status===401||e.status===403?'没有编辑权限，未保存':'保存失败，请再试一次';
function localRows(){
  const rows=[];
  Object.entries(store.get('vb-weeks')||{}).forEach(([id,v])=>{if(v.note&&!notes[id])rows.push({kind:'weeks',id,data:{note:v.note}})});
  Object.entries(store.get('vb-days')||{}).forEach(([id,v])=>{if(!days[id])rows.push({kind:'days',id,data:v})});
  return rows;
}

/* 画面 */
const pending={}, timers={}, busy={};
function queue(w,v){pending[w]=v;$('s-'+w).textContent='未保存';clearTimeout(timers[w]);timers[w]=setTimeout(()=>flush(w),900)}
async function flush(w){
  clearTimeout(timers[w]);
  if(busy[w]||pending[w]===undefined)return;
  busy[w]=true;
  const say=t=>{const o=$('s-'+w);if(o)o.textContent=t};
  while(pending[w]!==undefined){
    const v=pending[w];say('保存中…');
    try{await save([{kind:'weeks',id:w,data:{note:v}}]);if(pending[w]===v){delete pending[w];say('已保存')}}
    catch(e){say(why(e));break}
  }
  busy[w]=false;
}
function slotButton(d,s){
  const b=btn('slot'+(s.m?' m':''),null,()=>openAtt(d,s));
  if(tally){const n=el('span','num',(tally.counts[d+'|'+s.key]||0)+'/'+tally.total);n.title='出席人数';b.append(n)}
  b.append(el('b','',s.time||'时间待定'),el('span','',s.label));
  const away=tally&&tally.leave&&tally.leave[d+'|'+s.key];if(away)b.append(el('span','off','请假 '+away+' 人'));
  if(s.place)b.append(el('span','','@ '+s.place));
  return b;
}
function renderComps(){
  const list=Object.keys(days).filter(d=>d>=today&&days[d].comp).sort();
  $('compbox').hidden=!session&&!list.length;$('addcomp').hidden=!session;
  const box=$('comps');box.textContent='';
  if(!list.length)box.append(el('p','status','还没有比赛日期，按「添加比赛」加入。'));
  list.forEach((d,i)=>{
    const c=days[d].comp, n=Math.round((parse(d)-parse(today))/DAY), row=el('div','comp'+(i?' later':''));
    const num=el('span','count',n?String(n):'今天');num.append(el('small','',n?'天后':'比赛'));
    const t=el('div');t.append(el('b','',c.name),el('span','',[short(d)+'/'+d.slice(0,4)+' '+wk(d),c.place].filter(Boolean).join(' · ')));
    row.append(num,t);
    if(session)row.append(btn('','修改',()=>openComp(d)));
    box.append(row);
  });
}
const BOARD='2000-01-01'; /* 公告存放位置 */
const posts=()=>(days[BOARD]&&days[BOARD].list)||[];
function renderBoard(){
  const list=posts(), box=$('news');box.textContent='';
  $('newsbox').hidden=!session&&!list.length;$('addnews').hidden=!session;
  if(!list.length)box.append(el('p','status','目前没有公告。'));
  list.forEach(p=>{
    const c=el('div','notice');c.append(el('p','text',p.text),el('small','',short(p.date)+' 发布'));
    if(session)c.append(btn('','修改',()=>openNews(p)));
    box.append(c);
  });
  const f=notes[monday(today)];$('focusbox').hidden=!!session||!f||!f.trim();$('focus').textContent=f||'';
}
let newsId=null;
function openNews(p){newsId=p?p.id:null;$('n-text').value=p?p.text:'';$('n-del').hidden=!p;$('nerr').textContent='';$('ndlg').showModal()}
$('addnews').onclick=()=>openNews(null);
async function saveBoard(list){
  $('nerr').textContent='保存中…';
  try{await save([{kind:'days',id:BOARD,data:{list}}]);$('ndlg').close();render()}catch(e){$('nerr').textContent=why(e)}
}
$('nform').onsubmit=ev=>{
  ev.preventDefault();const text=$('n-text').value.trim();if(!text){$('nerr').textContent='请填写内容';return}
  const old=posts().find(p=>p.id===newsId);
  saveBoard(old?posts().map(p=>p===old?{...p,text}:p):[{id:Date.now().toString(36),date:todayMY(),text},...posts()]);
};
$('n-del').onclick=()=>saveBoard(posts().filter(p=>p.id!==newsId));
function dateBox(d){const e=el('div','date',short(d));e.append(el('small','',wk(d)+(d===today?' · 今天':'')));return e}
const monthDates=()=>{const out=[];for(let t=parse(month+'-01');iso(t).startsWith(month);t+=DAY)out.push(iso(t));return out};
function renderPlayer(root){
  monthDates().filter(d=>d>=today).forEach(d=>{
    const list=slotsOf(d), comp=days[d]&&days[d].comp;
    if(!list.length&&!comp)return;
    const row=el('section','row-day'+(d===today?' today':'')), box=el('div','slots');
    if(comp)box.append(el('span','tag c','比赛：'+comp.name));
    list.forEach(s=>box.append(slotButton(d,s)));
    row.append(dateBox(d),box);root.append(row);
  });
  if(!root.children.length)root.append(el('p','status','这个月没有接下来的练球。'));
}
function renderCoach(root){
  [...new Set(monthDates().map(monday))].forEach(w=>{
    const card=el('section','card'), g=el('div','days');
    card.append(el('h2','',short(w)+' – '+short(iso(parse(w)+6*DAY))));
    for(let i=0;i<7;i++){
      const d=iso(parse(w)+i*DAY), x=info(d), c=el('div','day'+(d<today?' past':'')+(d===today?' today':''));c.id='d-'+d;
      c.append(dateBox(d));
      if(days[d]&&days[d].comp)c.append(el('span','tag c','比赛：'+days[d].comp.name));
      if(x.rest)c.append(el('span','tag','休息'));
      slotsOf(d).forEach(s=>c.append(slotButton(d,s)));
      if(HOL[d])c.append(el('span','tag h',HOL[d]));
      if(x.note)c.append(el('span','tag',x.note));
      if(d>=FROM&&d<=END){const e=btn('edit','编辑 / 加时段',()=>openDay(d));e.id='e-'+d;c.append(e)}
      g.append(c);
    }
    const lab=el('label','','本周训练重点（本周的内容球员看得到）'), ta=el('textarea'), out=el('span','status');
    ta.id='n-'+w;ta.maxLength=3000;ta.placeholder='写下这个礼拜要练什么';ta.value=pending[w]??notes[w]??'';
    ta.oninput=()=>queue(w,ta.value);ta.onblur=()=>flush(w);out.id='s-'+w;
    lab.append(ta);card.append(g,lab,out);root.append(card);
  });
}
function render(){
  today=todayMY();
  const min=session?FIRST:(today.slice(0,7)<FIRST?FIRST:today.slice(0,7));
  if(month<min)month=min;if(month>LAST)month=LAST;
  $('prev').disabled=month<=min;$('next').disabled=month>=LAST;
  $('mname').textContent=month.slice(0,4)+'年 '+ +month.slice(5)+'月';
  $('loginbtn').hidden=!!session;$('logoutbtn').hidden=!session;
  $('upload').hidden=!(session&&loaded&&localRows().length);
  const root=$('view');root.textContent='';
  if(!loaded)return;
  renderBoard();renderComps();(session?renderCoach:renderPlayer)(root);
}
const step=n=>{const d=new Date(parse(month+'-01'));d.setUTCMonth(d.getUTCMonth()+n);month=iso(d.getTime()).slice(0,7);render()};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());

/* 考勤 */
/* 球队专属链接：网址后面的 #k=密码，打开一次后记在这台设备 */
let teamKey=store.get('vb-code')||'';
function readKey(){const k=new URLSearchParams(location.hash.slice(1)).get('k');if(k){teamKey=k;store.set('vb-code',k)}}
readKey();addEventListener('hashchange',readKey);
const NEEDLINK='请用教练发的球队专属链接打开，才能看名单和打勾。';
let att=null;
const attErr=e=>({bad_code:'这个链接已失效，请向教练拿新的专属链接。',past_day:'过去的日期不能修改，请找教练',need_reason:'请填写请假原因',login:'登入已过期，请重新登入'})[e.detail||e.code]||(e.status===404?'数据库还没更新，请教练执行新的 SQL':'连接失败，请检查网络');
async function rpc(fn,body){return api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(body)},session?await token():undefined)}
function openAtt(d,s){
  att={d,key:s.key,n:Symbol()};
  $('atitle').textContent=short(d)+' '+wk(d)+' · '+s.label;
  $('ainfo').textContent=[s.time,s.place].filter(Boolean).join(' @ ');
  $('alist').textContent='';$('amsg').textContent='';
  $('att').showModal();
  if(!session&&!teamKey){$('amsg').textContent=NEEDLINK;return}
  loadAtt();
}
function playerRow(cur,p,can,count){
  const row=el('div','player'), extra=el('div','reason');
  let status=p.status||'', reason=p.reason||'';
  const yes=btn('','出席'), no=btn('','请假');
  const paint=()=>{
    row.dataset.status=status;
    yes.className=status==='present'?'on-p':'';no.className=status==='leave'?'on-l':'';
    yes.setAttribute('aria-pressed',status==='present');no.setAttribute('aria-pressed',status==='leave');
    yes.disabled=no.disabled=!can;extra.textContent='';extra.className='reason';
    if(status==='leave'){extra.className='reason shown';extra.textContent=session?'原因：'+reason:'原因已交给教练'}
  };
  const send=async(next,why_)=>{
    yes.disabled=no.disabled=true;$('amsg').textContent='保存中…';
    try{
      await rpc('attendance_set',{p_day:cur.d,p_slot:cur.key,p_player:p.pid,p_status:next,p_reason:why_,p_code:teamKey});
      status=next;reason=why_;paint();if(att===cur)count(' · 已保存');
      loadTally().then(()=>{if(document.activeElement?.tagName!=='TEXTAREA')render()});
    }catch(e){paint();if(att===cur)$('amsg').textContent=attErr(e)}
  };
  yes.onclick=()=>send(status==='present'?'':'present','');
  no.onclick=()=>{
    if(status==='leave'){send('','');return}
    extra.textContent='';extra.className='reason';
    const i=el('input');i.maxLength=100;i.placeholder='请假原因';i.setAttribute('aria-label',p.pname+' 请假原因');
    const ok=()=>{if(!i.value.trim()){$('amsg').textContent='请填写请假原因';i.focus();return}send('leave',i.value.trim())};
    i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
    extra.append(i,btn('primary','提交',ok));i.focus();
  };
  row.append(el('span','',p.pname),yes,no,extra);paint();return row;
}
async function loadAtt(){
  const cur=att;$('amsg').textContent='读取中…';
  try{
    const rows=await rpc('attendance_get',{p_day:cur.d,p_slot:cur.key,p_code:teamKey});
    if(att!==cur)return;
    const can=!!session||cur.d>=todayMY(), list=$('alist');list.textContent='';
    const n=v=>list.querySelectorAll('[data-status="'+v+'"]').length;
    const count=more=>$('amsg').textContent='出席 '+n('present')+' / '+rows.length+' · 请假 '+n('leave')+(more||'');
    rows.forEach(p=>list.append(playerRow(cur,p,can,count)));
    count(can?'':'（过去的日期只能查看）');
  }catch(e){if(att===cur)$('amsg').textContent=attErr(e)}
}
$('aform').onsubmit=ev=>ev.preventDefault();

/* 时间选择（每 15 分钟） */
const OPTIONS=Array.from({length:73},(_,i)=>{const m=360+i*15;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')});
function picker(box,value,a='17:00',b='19:30'){
  box.textContent='';const v=times(value);
  [['开始',v[0]||a],['结束',v[1]||b]].forEach(([name,val])=>{
    const l=el('label','',name),s=el('select');
    [...new Set([...OPTIONS,val])].sort().forEach(t=>s.add(new Option(t,t)));s.value=val;l.append(s);box.append(l);
  });
}
const picked=box=>[...box.querySelectorAll('select')].map(s=>s.value);

/* 编辑某一天 */
let editing=null;
function field(name,value){const l=el('label','',name),i=el('input');i.maxLength=60;i.value=value||'';l.append(i);return [l,i]}
function addRow(e){
  const f=el('fieldset','xrow');f.dataset.id=e.id;
  const [nl,n]=field('名称',e.label),[pl,p]=field('地点',e.loc);n.name='label';p.name='loc';
  const t=el('div','times');picker(t,e.time,'08:00','10:00');
  f.append(nl,t,pl,btn('','删除此时间段',()=>f.remove()));$('extras').append(f);
}
function setForm(x){
  const d=defaults(editing);
  $('f-rest').checked=!!x.rest;$('f-on').checked=!!x.time;$('f-match').checked=!!x.match;
  const wkend=[0,6].includes(new Date(parse(editing)).getUTCDay());
  picker($('f-t'),x.time,wkend?'19:00':'17:00',wkend?'22:00':'19:30');
  picker($('f-mt'),x.mtime||d.mtime,'19:00','22:00');
  $('f-loc').value=x.loc??PLACE;$('f-opp').value=x.opp||'';$('f-mloc').value=x.mloc??PLACE;$('f-note').value=x.note||'';
  $('extras').textContent='';(x.extra||[]).forEach(addRow);
}
function openDay(d){editing=d;$('dtitle').textContent=short(d)+' '+wk(d);$('derr').textContent='';setForm(info(d));$('dlg').showModal()}
$('addslot').onclick=()=>addRow({id:'x'+Date.now().toString(36),label:'加练',time:'',loc:PLACE});
$('reset').onclick=()=>setForm(defaults(editing));
$('dform').onsubmit=async ev=>{
  ev.preventDefault();
  const rows=[...document.querySelectorAll('.xrow')];
  const used=[$('f-on').checked&&$('f-t'),$('f-match').checked&&$('f-mt'),...rows.map(r=>r.querySelector('.times'))].filter(Boolean);
  if(used.some(b=>{const [a,z]=picked(b);return z<=a})){$('derr').textContent='结束时间要比开始时间晚';return}
  const x={rest:$('f-rest').checked,time:$('f-on').checked?picked($('f-t')).join('–'):'',loc:$('f-loc').value.trim(),
    match:$('f-match').checked,mtime:picked($('f-mt')).join('–'),opp:$('f-opp').value.trim(),mloc:$('f-mloc').value.trim(),note:$('f-note').value.trim(),
    extra:rows.map(r=>({id:r.dataset.id,label:r.querySelector('[name=label]').value.trim(),time:picked(r.querySelector('.times')).join('–'),loc:r.querySelector('[name=loc]').value.trim()}))};
  if(days[editing]&&days[editing].comp)x.comp=days[editing].comp;
  $('derr').textContent='保存中…';
  try{await save([{kind:'days',id:editing,data:x}]);$('dlg').close();render()}catch(e){$('derr').textContent=why(e)}
};

/* 比赛 */
let compDay=null;
function openComp(d){
  compDay=d;const c=d?days[d].comp:{};
  $('c-date').value=d||'';$('c-name').value=c.name||'';$('c-place').value=c.place||'';$('c-del').hidden=!d;$('cerr').textContent='';$('cdlg').showModal();
}
$('addcomp').onclick=()=>openComp(null);
const without=d=>{const x={...(days[d]||{})};delete x.comp;return x};
async function saveComp(rows){
  $('cerr').textContent='保存中…';
  try{await save(rows);$('cdlg').close();render()}catch(e){$('cerr').textContent=why(e)}
}
$('cform').onsubmit=ev=>{
  ev.preventDefault();
  const d=$('c-date').value, name=$('c-name').value.trim();
  if(!name){$('cerr').textContent='请填比赛名称';return}
  if(d!==compDay&&days[d]&&days[d].comp){$('cerr').textContent='这一天已经有比赛，请按那场比赛的「修改」';return}
  const rows=[{kind:'days',id:d,data:{...without(d),comp:{name,place:$('c-place').value.trim()}}}];
  if(compDay&&compDay!==d)rows.push({kind:'days',id:compDay,data:without(compDay)});
  saveComp(rows);
};
$('c-del').onclick=()=>saveComp([{kind:'days',id:compDay,data:without(compDay)}]);

/* 登入与同步 */
$('loginbtn').onclick=()=>{$('lerr').textContent='';$('login').showModal()};
$('logoutbtn').onclick=()=>setSession(null);
$('lform').onsubmit=async ev=>{
  ev.preventDefault();$('lerr').textContent='登入中…';
  try{setSession(await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('l-email').value.trim(),password:$('l-pass').value})}));$('l-pass').value='';$('login').close();pull()}
  catch{$('lerr').textContent='登入失败，请检查 email、密码和网络。'}
};
$('upload').onclick=async()=>{try{await save(localRows());render()}catch(e){$('status').hidden=false;$('status').textContent=why(e)}};
async function pull(){
  const before=writes;
  try{
    const [rows]=await Promise.all([api('/rest/v1/calendar_entries?select=kind,id,data&order=kind,id'),loadTally()]);
    if(before!==writes)return;
    $('status').hidden=true;
    const sig=JSON.stringify([rows,tally])+todayMY();
    if(loaded&&sig===last)return;
    if(loaded&&(document.activeElement?.tagName==='TEXTAREA'||Object.keys(pending).length))return;
    last=sig;
    [notes,days].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
    rows.forEach(r=>{if(r.kind==='weeks')notes[r.id]=r.data.note;else days[r.id]=r.data});
    loaded=true;render();
  }catch{$('status').hidden=false;$('status').textContent='读取资料失败，请检查网络后刷新页面。'}
}
render();
if(cloud){pull();setInterval(()=>{if(!document.hidden)pull()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()})}
else $('status').textContent='请先填入 Supabase 设定。';
})();
</script>
